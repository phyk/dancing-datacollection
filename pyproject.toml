[project]
name = "dancing-datacollection"
version = "0.1.0"
description = "High-performance Rust engine with Python bindings to download, parse, and validate dancing competition results (TopTurnier/DTV format)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
module-name = "dancing_datacollection._dancing_datacollection"
